<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A & B 月度对账计算器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 560px;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 28px 32px 24px;
    }

    .card-header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .card-header p {
      margin-top: 6px;
      font-size: 13px;
      opacity: 0.85;
      line-height: 1.6;
    }

    .card-body {
      padding: 28px 32px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
      margin-top: 22px;
    }

    .section-title:first-child { margin-top: 0; }

    .rule-box {
      background: #f8f7ff;
      border-left: 3px solid #667eea;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: #555;
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .rule-box span.highlight {
      color: #764ba2;
      font-weight: 600;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: #444;
    }

    .form-group .sub-label {
      font-size: 11px;
      color: #999;
      font-weight: normal;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap .prefix {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
      font-size: 14px;
      pointer-events: none;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px 10px 28px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      color: #333;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      background: #fafafa;
    }

    .form-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
      background: #fff;
    }

    .btn {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 1px;
    }

    .btn:hover { opacity: 0.92; }
    .btn:active { transform: scale(0.98); }

    /* Result Area */
    #result {
      display: none;
      margin-top: 24px;
      border-radius: 14px;
      overflow: hidden;
    }

    .result-summary {
      padding: 20px 22px;
      text-align: center;
    }

    .result-summary.pay {
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      color: #fff;
    }

    .result-summary.receive {
      background: linear-gradient(135deg, #55efc4, #00b894);
      color: #fff;
    }

    .result-summary.balanced {
      background: linear-gradient(135deg, #74b9ff, #0984e3);
      color: #fff;
    }

    .result-summary .result-label {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 6px;
    }

    .result-summary .result-amount {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .result-summary .result-amount span.unit {
      font-size: 22px;
      font-weight: 600;
      margin-right: 2px;
    }

    .result-summary .result-desc {
      font-size: 13px;
      opacity: 0.88;
      margin-top: 8px;
      line-height: 1.6;
    }

    .breakdown {
      background: #f9f9f9;
      border-top: 1px solid #eee;
      padding: 18px 22px;
    }

    .breakdown h3 {
      font-size: 12px;
      font-weight: 700;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .breakdown-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
      color: #555;
      padding: 5px 0;
      border-bottom: 1px dashed #eee;
    }

    .breakdown-row:last-child { border-bottom: none; }

    .breakdown-row .val {
      font-weight: 600;
      color: #333;
    }

    .breakdown-row.total {
      margin-top: 6px;
      padding-top: 10px;
      border-top: 1.5px solid #ddd;
      border-bottom: none;
      font-size: 14px;
      color: #222;
      font-weight: 700;
    }

    .breakdown-row.total .val { color: #764ba2; }

    .error-msg {
      margin-top: 16px;
      background: #fff3f3;
      border: 1px solid #ffc0c0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: #c0392b;
      display: none;
    }

    @media (max-width: 420px) {
      .form-grid { grid-template-columns: 1fr; }
      .card-body { padding: 20px; }
      .card-header { padding: 20px; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <h1>💰 A柚子妈 & B柚子爸 月度对账计算器</h1>
    <p>
      公共基金 X：A 出 <strong>1/3</strong>，B 出 <strong>2/3</strong>（由 B 保管）<br/>
      月费用 Y：公共基金优先覆盖；超出部分 A 出 <strong>2/5</strong>，B 出 <strong>3/5</strong>
    </p>
  </div>

  <div class="card-body">
    <div class="section-title">📋 分摊规则</div>
    <div class="rule-box">
      <strong>① 公共基金内：</strong>按出资比例分摊（A: <span class="highlight">1/3</span>，B: <span class="highlight">2/3</span>）<br/>
      <strong>② 超出公共基金部分：</strong>A 承担 <span class="highlight">2/5</span>，B 承担 <span class="highlight">3/5</span>
    </div>

    <div class="section-title">✏️ 填写数据</div>
    <div class="form-grid">
      <div class="form-group">
        <label>X — 公共基金总额 <span class="sub-label">（A出1/3，B出2/3）</span></label>
        <div class="input-wrap">
          <span class="prefix">¥</span>
          <input type="number" id="X" placeholder="如 3000" min="0" step="0.01" />
        </div>
      </div>

      <div class="form-group">
        <label>Y — 本月总费用 <span class="sub-label" id="Y_hint">（填写另外两项可自动推算）</span></label>
        <div class="input-wrap">
          <span class="prefix">¥</span>
          <input type="number" id="Y" placeholder="如 2000" min="0" step="0.01" oninput="autoCalc('Y')" />
        </div>
      </div>

      <div class="form-group">
        <label>Y1 — A 实际垫付 <span class="sub-label" id="Y1_hint">（填写另外两项可自动推算）</span></label>
        <div class="input-wrap">
          <span class="prefix">¥</span>
          <input type="number" id="Y1" placeholder="如 500" min="0" step="0.01" oninput="autoCalc('Y1')" />
        </div>
      </div>

      <div class="form-group">
        <label>Y2 — B 实际垫付 <span class="sub-label" id="Y2_hint">（填写另外两项可自动推算）</span></label>
        <div class="input-wrap">
          <span class="prefix">¥</span>
          <input type="number" id="Y2" placeholder="如 1500" min="0" step="0.01" oninput="autoCalc('Y2')" />
        </div>
      </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <button class="btn" onclick="calculate()">📊 开始计算</button>

    <div id="result">
      <div class="result-summary" id="resultSummary">
        <div class="result-label" id="resultLabel"></div>
        <div class="result-amount" id="resultAmount"></div>
        <div class="result-desc" id="resultDesc"></div>
      </div>
      <div class="breakdown">
        <h3>📂 详细计算过程</h3>
        <div class="breakdown-row">
          <span>月总费用 Y</span><span class="val" id="bd_Y"></span>
        </div>
        <div class="breakdown-row">
          <span>公共基金承担 (min(X,Y))</span><span class="val" id="bd_fund"></span>
        </div>
        <div class="breakdown-row">
          <span>超出公共基金部分</span><span class="val" id="bd_over"></span>
        </div>
        <div class="breakdown-row" style="margin-top:8px; padding-top:8px; border-top:1px solid #e0e0e0;">
          <span>A 应承担总费用</span><span class="val" id="bd_A_cost"></span>
        </div>
        <div class="breakdown-row">
          <span>A 已向公共基金出资</span><span class="val" id="bd_A_fund_contrib"></span>
        </div>
        <div class="breakdown-row">
          <span>A 本月实际垫付 Y1</span><span class="val" id="bd_Y1"></span>
        </div>
        <div class="breakdown-row total">
          <span id="bd_net_label">A 还需净支付 B</span><span class="val" id="bd_net"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function fmt(n) {
    // 格式化为两位小数，带¥符号
    return '¥' + Math.abs(n).toFixed(2);
  }

  function calculate() {
    const errEl = document.getElementById('errorMsg');
    errEl.style.display = 'none';

    const X  = parseFloat(document.getElementById('X').value);
    const Y  = parseFloat(document.getElementById('Y').value);
    const Y1 = parseFloat(document.getElementById('Y1').value);
    const Y2 = parseFloat(document.getElementById('Y2').value);

    // --- 校验 ---
    if ([X, Y, Y1, Y2].some(v => isNaN(v) || v < 0)) {
      showError('请填写所有字段，且金额不能为负数。');
      return;
    }

    const tolerance = 0.01;
    if (Math.abs(Y1 + Y2 - Y) > tolerance) {
      showError(`Y1 + Y2 = ${(Y1 + Y2).toFixed(2)} ≠ Y = ${Y.toFixed(2)}，请检查数据。`);
      return;
    }

    // --- 计算 ---
    // 1. 公共基金最多承担 X，本月费用 Y
    const fundUsed = Math.min(X, Y);   // 公共基金实际用掉的部分
    const overPart = Math.max(0, Y - X); // 超出公共基金的部分

    // 2. A 应承担总费用
    //    公共基金内按 1/3 承担，超出部分按 2/5 承担
    const A_cost = fundUsed * (1/3) + overPart * (2/5);

    // 3. A 的实际已付出
    //    - 公共基金里出了 X/3（存在B那里）
    //    - 本月垫付了 Y1
    const A_fund_contrib = X / 3;
    const A_already_paid = A_fund_contrib + Y1;

    // 4. A 净需支付 = 应承担 - 已付
    //    正值: A 还要给 B
    //    负值: B 需要还给 A
    const net = A_cost - A_already_paid;

    // --- 展示结果 ---
    const resultEl    = document.getElementById('result');
    const summaryEl   = document.getElementById('resultSummary');
    const labelEl     = document.getElementById('resultLabel');
    const amountEl    = document.getElementById('resultAmount');
    const descEl      = document.getElementById('resultDesc');

    resultEl.style.display = 'block';

    // 清除所有class
    summaryEl.className = 'result-summary';

    if (Math.abs(net) < tolerance) {
      summaryEl.classList.add('balanced');
      labelEl.textContent  = '🎉 完美平账';
      amountEl.innerHTML   = '<span class="unit">¥</span>0.00';
      descEl.textContent   = 'A 和 B 无需互相转账，账目已平衡。';
    } else if (net > 0) {
      summaryEl.classList.add('pay');
      labelEl.textContent  = '💸 A 需转给 B（M）';
      amountEl.innerHTML   = `<span class="unit">¥</span>${net.toFixed(2)}`;
      descEl.textContent   = `A 本月应承担 ${fmt(A_cost)}，实际已付 ${fmt(A_already_paid)}（含公共基金出资 ${fmt(A_fund_contrib)} + 垫付 ${fmt(Y1)}），差额需补给 B。`;
    } else {
      summaryEl.classList.add('receive');
      labelEl.textContent  = '🎁 B 需转给 A（N）';
      amountEl.innerHTML   = `<span class="unit">¥</span>${Math.abs(net).toFixed(2)}`;
      descEl.textContent   = `A 本月应承担 ${fmt(A_cost)}，实际已付 ${fmt(A_already_paid)}（含公共基金出资 ${fmt(A_fund_contrib)} + 垫付 ${fmt(Y1)}），B 需退还多付部分给 A。`;
    }

    // 明细
    document.getElementById('bd_Y').textContent            = fmt(Y);
    document.getElementById('bd_fund').textContent         = `${fmt(fundUsed)}（A承担 ${fmt(fundUsed/3)}，B承担 ${fmt(fundUsed*2/3)}）`;
    document.getElementById('bd_over').textContent         = overPart > 0 ? `${fmt(overPart)}（A承担 ${fmt(overPart*2/5)}，B承担 ${fmt(overPart*3/5)}）` : '¥0.00（未超出）';
    document.getElementById('bd_A_cost').textContent       = fmt(A_cost);
    document.getElementById('bd_A_fund_contrib').textContent = fmt(A_fund_contrib);
    document.getElementById('bd_Y1').textContent           = fmt(Y1);
    if (net >= 0) {
      document.getElementById('bd_net_label').textContent = 'A 还需净支付 B';
      document.getElementById('bd_net').textContent       = '+' + fmt(net) + '（A 给 B）';
    } else {
      document.getElementById('bd_net_label').textContent = 'B 需退还 A';
      document.getElementById('bd_net').textContent       = '+' + fmt(Math.abs(net)) + '（B 给 A）';
    }
  }

  // 标记哪个字段是「被自动填入」的，避免循环触发
  let autoFilledField = null;

  function setAutoStyle(id, isAuto) {
    const el = document.getElementById(id);
    const hint = document.getElementById(id + '_hint');
    if (isAuto) {
      el.style.background = '#f0f4ff';
      el.style.color = '#667eea';
      if (hint) { hint.textContent = '（已自动推算）'; hint.style.color = '#667eea'; }
    } else {
      el.style.background = '';
      el.style.color = '';
      if (hint) { hint.textContent = '（填写另外两项可自动推算）'; hint.style.color = ''; }
    }
  }

  function autoCalc(changed) {
    // 如果当前修改的字段正是被自动填入的字段，说明用户手动覆盖了，取消自动状态
    if (autoFilledField === changed) {
      autoFilledField = null;
      setAutoStyle(changed, false);
    }

    const Y  = parseFloat(document.getElementById('Y').value);
    const Y1 = parseFloat(document.getElementById('Y1').value);
    const Y2 = parseFloat(document.getElementById('Y2').value);

    const hasY  = !isNaN(Y);
    const hasY1 = !isNaN(Y1);
    const hasY2 = !isNaN(Y2);

    // 根据哪两个有值，推算第三个（且第三个不是当前正在编辑的字段）
    if (hasY && hasY1 && !hasY2 && changed !== 'Y2') {
      const val = +(Y - Y1).toFixed(2);
      document.getElementById('Y2').value = val >= 0 ? val : '';
      autoFilledField = 'Y2';
      setAutoStyle('Y2', val >= 0);
      setAutoStyle('Y', false);
      setAutoStyle('Y1', false);
    } else if (hasY && hasY2 && !hasY1 && changed !== 'Y1') {
      const val = +(Y - Y2).toFixed(2);
      document.getElementById('Y1').value = val >= 0 ? val : '';
      autoFilledField = 'Y1';
      setAutoStyle('Y1', val >= 0);
      setAutoStyle('Y', false);
      setAutoStyle('Y2', false);
    } else if (hasY1 && hasY2 && !hasY && changed !== 'Y') {
      const val = +(Y1 + Y2).toFixed(2);
      document.getElementById('Y').value = val;
      autoFilledField = 'Y';
      setAutoStyle('Y', true);
      setAutoStyle('Y1', false);
      setAutoStyle('Y2', false);
    } else if (hasY && hasY1 && hasY2) {
      // 三个都有值时，被自动填入的那个跟随变化
      if (autoFilledField === 'Y2' && changed !== 'Y2') {
        const val = +(Y - Y1).toFixed(2);
        document.getElementById('Y2').value = val >= 0 ? val : '';
        setAutoStyle('Y2', val >= 0);
      } else if (autoFilledField === 'Y1' && changed !== 'Y1') {
        const val = +(Y - Y2).toFixed(2);
        document.getElementById('Y1').value = val >= 0 ? val : '';
        setAutoStyle('Y1', val >= 0);
      } else if (autoFilledField === 'Y' && changed !== 'Y') {
        const val = +(Y1 + Y2).toFixed(2);
        document.getElementById('Y').value = val;
        setAutoStyle('Y', true);
      }
    }
  }

  function showError(msg) {
    const errEl = document.getElementById('errorMsg');
    errEl.textContent = '⚠️ ' + msg;
    errEl.style.display = 'block';
    document.getElementById('result').style.display = 'none';
  }

  // 回车触发计算
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') calculate();
  });
</script>

</body>
</html>
